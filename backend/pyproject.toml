[project]
name = "shipyard-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "pyjwt>=2.15,<2.16",
    "argon2-cffi>=25.1,<25.2",
]

[dependency-groups]
dev = ["pytest>=9.2,<9.3", "httpx>=0.28,<0.29"]

[project.scripts]
init-db = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
